[metadata]
name = atrex
version = 0.2.0
description = Alibaba TensoR Engine for heterogeneous devices (X)
author = Alibaba
author_email = atrex@alibaba-inc.com
license = Apache-2.0

[options]
packages = find:
package_dir =
    = python
include_package_data = True
python_requires = >=3.10
install_requires =
    apache-tvm-ffi>=0.1.12,<0.2
    nvidia-cutlass-dsl[cu13]==4.6.2
    quack-kernels==0.6.4
    torch
    einops
    typing_extensions
    torch-c-dlpack-ext

[options.packages.find]
where = python
include = atrex*
