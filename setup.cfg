[metadata]
name = atrex
version = 0.2.0
description = Alibaba TensoR Engine for heterogeneous devices (X)
author = Alibaba
author_email = atrex@alibaba-inc.com
license = Apache-2.0

[options]
packages = find:
package_dir =
    = python
include_package_data = True
python_requires = >=3.10
install_requires =
    apache-tvm-ffi>=0.1.11,<0.2
    einops
    nvidia-cutlass-dsl==4.6.1
    quack-kernels==0.5.0
    torch-c-dlpack-ext
    typing_extensions

[options.packages.find]
where = python
include = atrex*
